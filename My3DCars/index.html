<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>100 سيارة من MagicaVoxel</title>
    <style>
        body { margin: 0; overflow: hidden; }
        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 10px 18px;
            border-radius: 30px;
            font-size: 14px;
            pointer-events: none;
            z-index: 10;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            background: rgba(0,0,0,0.8);
            padding: 20px 40px;
            border-radius: 40px;
            font-size: 20px;
            z-index: 20;
        }
    </style>
</head>
<body>
    <div id="loading">⏳ جاري تحميل مجسمات السيارات...</div>
    <div id="info">🚗 100 سيارة من MagicaVoxel | اسحب للتحريك</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.126.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.126.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --- إعداد المشهد ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(15, 10, 25);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 1, 0);
        controls.maxPolarAngle = Math.PI / 2.4;
        controls.minDistance = 5;
        controls.maxDistance = 60;

        // --- الإضاءة ---
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffeedd, 1.2);
        sunLight.position.set(20, 30, 10);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 1024;
        sunLight.shadow.mapSize.height = 1024;
        const d = 30;
        sunLight.shadow.camera.left = -d;
        sunLight.shadow.camera.right = d;
        sunLight.shadow.camera.top = d;
        sunLight.shadow.camera.bottom = -d;
        scene.add(sunLight);

        const backLight = new THREE.DirectionalLight(0xaaccff, 0.5);
        backLight.position.set(-15, 10, -20);
        scene.add(backLight);

        // --- إنشاء الطريق ---
        function createRoad() {
            const groundGeo = new THREE.PlaneGeometry(200, 200);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x2d5a27, roughness: 0.9 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.1;
            ground.receiveShadow = true;
            scene.add(ground);

            const roadMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8 });
            const road = new THREE.Mesh(new THREE.PlaneGeometry(6, 200), roadMat);
            road.rotation.x = -Math.PI / 2;
            road.position.y = 0;
            road.receiveShadow = true;
            scene.add(road);

            const lineMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
            for (let z = -95; z <= 95; z += 4) {
                const line = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 1.8), lineMat);
                line.rotation.x = -Math.PI / 2;
                line.position.set(0, 0.01, z);
                scene.add(line);
            }
        }
        createRoad();

        // --- 🚗 تحميل مجسمك من MagicaVoxel ---
        const CAR_MODEL_URL = 'vrwrfe-2.obj';

        function loadMyCar() {
            return new Promise((resolve, reject) => {
                const loader = new OBJLoader();

                loader.load(
                    CAR_MODEL_URL,
                    (data) => {
                        const model = data;
                        
                        model.scale.set(1.5, 1.5, 1.5);
                        
                        model.traverse((child) => {
                            if (child.isMesh) {
                                child.castShadow = true;
                                child.receiveShadow = true;
                            }
                        });
                        
                        resolve(model);
                    },
                    undefined,
                    (error) => {
                        console.error('فشل التحميل:', error);
                        reject(error);
                    }
                );
            });
        }

        // --- إنشاء 100 سيارة ---
        async function createCars() {
            try {
                const carTemplate = await loadMyCar();
                
                document.getElementById('loading').style.display = 'none';

                const carCount = 100;
                const spacing = 190 / carCount;

                for (let i = 0; i < carCount; i++) {
                    const car = carTemplate.clone();
                    const z = -95 + i * spacing;
                    const x = (Math.random() - 0.5) * 1.0;
                    
                    car.position.set(x, 0, z);
                    car.rotation.y = (Math.random() - 0.5) * 0.2;
                    
                    scene.add(car);
                }

                for (let i = 0; i < 20; i++) {
                    const car = carTemplate.clone();
                    const z = -90 + i * 10;
                    const x = (i % 2 === 0) ? 4.5 : -4.5;
                    car.position.set(x, 0, z);
                    car.rotation.y = (i % 2 === 0) ? 0.3 : -0.3;
                    scene.add(car);
                }

                console.log(`✅ تم إنشاء ${carCount + 20} سيارة بنجاح!`);
            } catch (error) {
                console.error('❌ خطأ في تحميل السيارة:', error);
                document.getElementById('loading').textContent = '❌ فشل التحميل! تأكد من وجود الملف';
                document.getElementById('loading').style.color = '#ff6666';
                document.getElementById('loading').style.display = 'block';
            }
        }

        createCars();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
